name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install matplotlib (plots.py render tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-matplotlib

      - name: Python tests
        env:
          OB_BUILD_DIR: build
        run: python3 -m unittest discover -s python/tests -v

      - name: Install Icarus Verilog + Verilator (FPGA sim)
        run: sudo apt-get install -y --no-install-recommends iverilog verilator

      - name: FPGA parser vs C++ model
        run: fpga/sim.sh --events 20000 --build-dir build
